name: Build APK Berkah ASMR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BerkahASMR.apk

      - name: Simpan APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BerkahASMR-APK
          path: BerkahASMR.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" BerkahASMR.apk \
            --title "Berkah ASMR v1.0.${{ github.run_number }}" \
            --notes "APK dibuat otomatis oleh GitHub Actions. Download BerkahASMR.apk di bawah, lalu buka di HP Android untuk menginstal."
